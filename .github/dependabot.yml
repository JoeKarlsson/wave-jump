version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # GitHub's default branch is develop, but master is the one that deploys
    target-branch: master
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    # GitHub's default branch is develop, but master is the one that deploys
    target-branch: master
    schedule:
      interval: monthly
